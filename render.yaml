# Seguridad 360: los datos viven en Odoo; el servicio no guarda nada en disco.
services:
  - type: web
    name: arme-seguridad-360
    runtime: node
    plan: free
    region: oregon
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ACCESS_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASSWORD
        sync: false
