# Plan free: el disco es efímero (datos/registros.json se pierde en cada redeploy/reinicio).
services:
  - type: web
    name: arme-seguridad-360
    runtime: node
    plan: free
    region: oregon
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ACCESS_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /tmp/data
    # Con plan starter (pago) se puede persistir con disco:
    # disk: { name: datos, mountPath: /var/data, sizeGB: 1 }  y DATA_DIR=/var/data
